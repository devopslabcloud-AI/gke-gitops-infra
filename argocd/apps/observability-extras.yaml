apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after prometheus operator CRDs exist
spec:
  project: platform
  source:
    repoURL: https://github.com/devopslabcloud-AI/gke-gitops-infra.git
    targetRevision: main
    path: observability
    directory:
      recurse: true
      include: "**/*.yaml"   # ignore the raw dashboard .json (loaded via ConfigMap)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
