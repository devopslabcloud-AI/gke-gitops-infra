apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservice-sa
  namespace: microservice
  annotations:
    # Workload Identity: binds this KSA to the Google SA created in Terraform.
    # Replace gitops-gke-prod with your GCP project.
    iam.gke.io/gcp-service-account: microservice-app@gitops-gke-prod.iam.gserviceaccount.com
