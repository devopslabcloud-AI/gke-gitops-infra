apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservice-sa
  namespace: microservice
  annotations:
    # Workload Identity: binds this KSA to the Google SA created in Terraform.
    # Replace PROJECT_ID with your GCP project.
    iam.gke.io/gcp-service-account: microservice-app@PROJECT_ID.iam.gserviceaccount.com
