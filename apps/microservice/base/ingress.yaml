apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice
  namespace: microservice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.REPLACE_LB_IP.sslip.io   # overlay patches this to app.<LB_IP>.sslip.io
      secretName: microservice-tls
  rules:
    - host: app.REPLACE_LB_IP.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microservice
                port:
                  number: 80
